<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema</title>
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="shortcut icon" href="../Imagem/file.png">
    <script src="../script/particles.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main>
        <button type="submit" onclick="prencher()" style="opacity: 0%;">
                <span class="btn-text">CADASTRAR</span>
        </button>
        <canvas id="particles-canvas"></canvas>
        
        <div class="login-container">
            <form action="../PHP/cadastro.php" method="post" id="cadastroForm">
                <div class="header">
                    <div class="logo-container">
                        <img src="../Imagem/file.png" alt="Logo">
                    </div>
                    <h1>CRIAR CONTA</h1>
                    <p class="subtitle">Preencha os dados para se cadastrar</p>
                </div>

                <div class="form-content">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <div class="input-container">
                            <i class="fas fa-id-card input-icon"></i>
                            <input 
                                type="text" 
                                id="cpf"
                                name="cpf" 
                                class="form-input"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <div class="input-container">
                            <i class="fas fa-user input-icon"></i>
                            <input 
                                type="text" 
                                id="nome"
                                name="nome" 
                                class="form-input"
                                placeholder="Digite seu nome completo"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="social">Nome Social</label>
                        <div class="input-container">
                            <i class="fas fa-user-tag input-icon"></i>
                            <input 
                                type="text" 
                                id="social"
                                name="social" 
                                class="form-input"
                                placeholder="Digite seu nome social (opcional)"
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="mail">E-mail</label>
                        <div class="input-container">
                            <i class="fas fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                id="mail"
                                name="mail" 
                                class="form-input"
                                placeholder="seu@email.com"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="phone">Telefone</label>
                        <div class="input-container">
                            <i class="fas fa-phone input-icon"></i>
                            <input 
                                id="fone"
                                name="fone" 
                                class="form-input"
                                placeholder="(11) 12345-6789"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <div class="input-container">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="senha"
                                name="senha" 
                                class="form-input"
                                placeholder="Digite sua Senha"
                                maxlength="32"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('senha', 'toggleIcon1')">
                                <i class="fas fa-eye" id="toggleIcon1"></i>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="consenha">Confirmar Senha</label>
                        <div class="input-container">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="consenha"
                                name="consenha" 
                                class="form-input"
                                placeholder="Confirme sua senha"
                                maxlength="32"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('consenha', 'toggleIcon2')">
                                <i class="fas fa-eye" id="toggleIcon2"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">CADASTRAR</span>
                        <i class="fas fa-user-plus btn-icon"></i>
                    </button>

                    <div class="signup-link">
                        <p>Já possui conta? 
                            <a href="login.html">Faça login aqui</a>
                        </p>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Máscara para CPF
        function formatCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            return cpf;
        }

        // Máscara para Telefone
        function formatPhone(phone) {
            phone = phone.replace(/\D/g, ''); // Remove tudo que não é dígito

            // Formata com DDD e número de 9 dígitos (celular)
            if (phone.length > 10) {
                phone = phone.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            }
            // Formata com DDD e número de 8 dígitos (telefone fixo)
            else if (phone.length > 2) {
                phone = phone.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else {
                phone = phone.replace(/^(\d*)/, '($1');
            }

            return phone;
        }

        document.getElementById('cpf').addEventListener('input', function(e) {
            e.target.value = formatCPF(e.target.value);
        });

        document.getElementById('fone').addEventListener('input', function(e) {
            e.target.value = formatPhone(e.target.value);
        });

        // Toggle password visibility (versão melhorada para múltiplos campos)
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Validação de senha em tempo real
        document.getElementById('consenha').addEventListener('input', function() {
            const senha = document.getElementById('senha').value;
            const consenha = this.value;
            
            if (consenha && senha !== consenha) {
                this.classList.add('error');
                this.classList.remove('success');
            } else if (consenha && senha === consenha) {
                this.classList.remove('error');
                this.classList.add('success');
            } else {
                this.classList.remove('error', 'success');
            }
        });

        // Form validation
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            const cpf = document.getElementById('cpf').value;
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('mail').value;
            const senha = document.getElementById('senha').value;
            const consenha = document.getElementById('consenha').value;
            
            // Validação do CPF
            if (cpf.replace(/\D/g, '').length !== 11) {
                e.preventDefault();
                alert('Por favor, digite um CPF válido com 11 dígitos.');
                return;
            }
            
            // Validação do nome
            if (nome.trim().length < 2) {
                e.preventDefault();
                alert('Por favor, digite um nome válido.');
                return;
            }
            
            // Validação do email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                e.preventDefault();
                alert('Por favor, digite um e-mail válido.');
                return;
            }
            
            // Validação da senha
            if (senha.length > 32) {
                e.preventDefault();
                alert('A senha deve ter no máximo 32 caracteres.');
                return;
            }
            
            // Validação da confirmação de senha
            if (senha !== consenha) {
                e.preventDefault();
                alert('As senhas não coincidem. Por favor, verifique.');
                return;
            }
        });

        // Loading state for button
        document.getElementById('cadastroForm').addEventListener('submit', function() {
            const btn = document.querySelector('.login-btn');
            const btnText = document.querySelector('.btn-text');
            const btnIcon = document.querySelector('.btn-icon');
            
            btnText.textContent = 'CADASTRANDO...';
            btnIcon.classList.remove('fa-user-plus');
            btnIcon.classList.add('fa-spinner', 'fa-spin');
            btn.disabled = true;
        });

        // Validação de CPF avançada
        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            
            if (cpf.length !== 11) return false;
            
            // Verifica se todos os dígitos são iguais
            if (/^(\d)\1+$/.test(cpf)) return false;
            
            // Validação dos dígitos verificadores
            let soma = 0;
            for (let i = 0; i < 9; i++) {
                soma += parseInt(cpf.charAt(i)) * (10 - i);
            }
            let resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(9))) return false;
            
            soma = 0;
            for (let i = 0; i < 10; i++) {
                soma += parseInt(cpf.charAt(i)) * (11 - i);
            }
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(10))) return false;
            
            return true;
        }

        function prencher() {
            document.getElementById('cpf').value = "54964787826";
            document.getElementById('fone').value = "11964448966";
            document.getElementById('mail').value = "guloso@gmail.com";
            document.getElementById('nome').value = "John Doki Doki";
            document.getElementById('social').value = 'Jonh TCC';
            document.getElementById('senha').value = 'rique.2008';
            document.getElementById('consenha').value = 'rique.2008';
        }

        // Validação visual do CPF
        document.getElementById('cpf').addEventListener('blur', function() {
            const cpf = this.value;
            if (cpf && !validarCPF(cpf)) {
                this.classList.add('error');
                this.classList.remove('success');
            } else if (cpf) {
                this.classList.remove('error');
                this.classList.add('success');
            }
        });

        // Validação visual do email
        document.getElementById('mail').addEventListener('blur', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) {
                this.classList.add('error');
                this.classList.remove('success');
            } else if (email) {
                this.classList.remove('error');
                this.classList.add('success');
            }
        });
    </script>
</body>
</html>
